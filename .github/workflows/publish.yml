name: Publish to npm

# Publishes to the public npm registry using npm Trusted Publishing (OIDC):
# no NPM_TOKEN secret — GitHub mints a short-lived credential per run and npm
# records build provenance automatically.
#
# Requires a Trusted Publisher configured on npmjs.com:
#   package -> Settings -> Trusted Publisher -> GitHub Actions
#     org/user: loneshaana   repo: leetcode-cli-tui   workflow: publish.yml
#
# Trigger by publishing a GitHub Release, or manually from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        # NOTE: deliberately NO `registry-url` here. Passing it makes
        # actions/setup-node write a temp .npmrc containing
        #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
        # and point NPM_CONFIG_USERCONFIG at it. With no token set, npm sees a
        # configured-but-empty auth token and SKIPS OIDC trusted publishing,
        # failing with E404. Omitting registry-url leaves auth unconfigured so
        # npm performs the OIDC exchange. Registry defaults to npmjs.org.
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing needs npm >= 11.5.1; the bundled npm is older.
      - name: Upgrade npm (OIDC support)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish (OIDC, no token)
        run: npm publish --access public --registry https://registry.npmjs.org
