name: Publish to npm

# Publishes to the public npm registry from GitHub's runners (so it isn't
# affected by local network/registry restrictions).
#
# Auth: an NPM_TOKEN secret (npm "Automation" token, or a granular read/write
# token). Add it with:  gh secret set NPM_TOKEN
#
# Once the package exists you can migrate to Trusted Publishing (OIDC) and drop
# the token — see README "Releasing".
#
# Trigger by publishing a GitHub Release, or manually from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm record build provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
